<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Stats preview card component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
    }
    body{
      font-family: Inter;
      color: red;
      background-color: hsl(233, 47%, 7%);
      min-height: 100vh;
      display: grid;
      place-content: center;
    }
    .card-container{
      background-color: hsl(244, 37%, 16%);
      display: flex;
      flex-direction: row;
      column-gap: 20px;
      justify-content: center;
      align-items: center;
      border-radius: 8px;
      overflow: hidden;
      width: 1100px;
    }
    .info-container{
      display: flex;
      flex-direction: column;
      row-gap: 30px;
      margin: 80px;
      margin-right: 100px;
    }
    .topic-headline{
      color: hsl(0, 0%, 100%);
      font-family: Inter;
      font-size: 35px;
      font-weight: 700;
    }
    .topic-headline span{
      color: hsl(277, 64%, 61%);
    }
    .description{
      color: hsla(0, 0%, 100%, 0.75);
      font-size: 13px;
      font-weight: 400;
      line-height: 25px;
    }
    .stats-conatiner{
      color: hsl(0, 0%, 100%);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 50px;
      text-align: left;
      margin-top: 50px;

    }
    .stats-conatiner h3{
      font-size: 23px;
    }
    .stats-conatiner p{
      font-size: 14px;
      color: hsla(0, 0%, 100%, 0.6);
      margin-top: 8px;
      font-weight: 300;
    }
    .img-conatiner{
      height: 480px;
      width: 1200px;
      position: relative;
      background: hsl(277, 64%, 61%);
    }
    .img-conatiner img{
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      mix-blend-mode: multiply;
      opacity: 0.8;
    }
    .attribution{
      font-size: 0.6875rem;
      text-align: center;
      color: hsl(277, 64%, 61%);
    }
    .attribution a{
      color: hsl(228, 45%, 44%);
    }

    @media (max-width: 375px){
      .card-container{
        flex-direction: column;
        width: 300px;
      }
      .info-container{
        order: 2;
        margin: 26px 24px 32px;
        row-gap: 18px;
        text-align: center;
        align-items: center;
      }
      .topic-headline{
        font-size: 28px;
      }
      .description{
        text-align: center;
      }
      .stats-conatiner{
        grid-template-columns: 1fr;
        gap: 24px;
        text-align: center;
        margin-top: 0;
      }
      .img-conatiner{
        order: 1;
        width: 100%;
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <main class="card-container">
    <div class="info-container">
      <h1 class="topic-headline">Get <span>insights</span> that help your business grow.</h1>
      <p class="description">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
      <div class="stats-conatiner">
        <div>
          <h3>10k+</h3>
          <p>COMPANIES</p>
        </div>
        <div>
          <h3>314</h3>
          <p>TEMPLATES</p>
        </div>
        <div>
          <h3>12M+</h3>
          <p>QUERIES</p>
        </div>
      </div>
    </div>
    <div class="img-conatiner">
      <img src="images/image-header-desktop.jpg">
    </div>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/challenges/stats-preview-card-component-8JqbgoU62" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/kartik-kumar25" target="_blank">Kartik Kumar</a>.
  </footer>
</body>
</html>
